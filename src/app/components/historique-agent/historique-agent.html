<div class="p-6 bg-white rounded-lg shadow-md">
  <h3 class="text-xl font-bold text-gray-800 mb-4">Historique des Transactions (Agent)</h3>

  <!-- Zone des filtres -->
  <div class="flex flex-col md:flex-row gap-4 mb-6">
    <input 
      type="text" 
      [(ngModel)]="rechercheTexte" 
      (input)="filtrerTransactions()"
      placeholder="Rechercher par nom de client ou numéro de compte..."
      class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm flex-1"
    />

    <select 
      [(ngModel)]="typeFiltre" 
      (change)="filtrerTransactions()"
      class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      <option value="TOUS">Tous les types</option>
      <option value="Dépôt">Dépôt</option>
      <option value="Retrait">Retrait</option>
      <option value="Virement">Virement</option>
    </select>
  </div>

  <!-- Message si vide -->
  <div *ngIf="transactionsFiltrees.length === 0" class="text-gray-500 py-4 text-center">
    Aucune transaction trouvée.
  </div>

  <button (click)="telechargerPDF()" class="bg-blue-600 text-white px-4 py-2 mb-4 rounded-lg hover:bg-blue-700 transition">
  Télécharger en PDF
</button>

  <!-- Tableau des transactions -->
  <div *ngIf="transactionsFiltrees.length > 0" class="overflow-x-auto shadow-md rounded-lg">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Client</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Compte</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Montant</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let t of transactionsFiltrees" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{ t.date }}</td>
         <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold" [ngClass]="{'text-green-600': t.type === 'Dépôt', 'text-red-600': t.type === 'Retrait', 'text-blue-600': t.type === 'Virement'}">
  {{ t.type }}
</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800 font-medium">{{ t.clientNom || t.client || 'Client inconnu' }}</td>
<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ t.numeroCompte || t.compte || 'N/A' }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">{{ t.montant }} FCFA</td>
        </tr>
      </tbody>
    </table>

    <tr>
  
</tr>
  </div>
</div>
