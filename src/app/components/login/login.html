<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    
    <!-- En-tête -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-blue-700 mb-2">Microbank Connect</h1>
      <p class="text-gray-500">Veuillez vous connecter à votre espace</p>
    </div>

    <!-- Alerte d'erreur (s'affiche uniquement si les identifiants sont faux) -->
    <div *ngIf="messageErreur" class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6" role="alert">
      <p>{{ messageErreur }}</p>
    </div>

    <!-- Formulaire -->
    <form (ngSubmit)="seConnecter()">
      
      <!-- Champ Email -->
      <div class="mb-5">
        <label for="email" class="block text-gray-700 font-semibold mb-2">Adresse Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
          placeholder="exemple@microbank.com"
        >
      </div>

      <!-- Champ Mot de passe -->
      <div class="mb-8">
        <label for="mdp" class="block text-gray-700 font-semibold mb-2">Mot de passe</label>
        <input
          type="password"
          id="mdp"
          name="mdp"
          [(ngModel)]="mdp"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
          placeholder="••••••••"
        >
      </div>

      <!-- Bouton de validation -->
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-md"
      >
        Se connecter
      </button>

    </form>

    <!-- Zone d'aide pour les tests (à supprimer avant la livraison finale) -->
    <div class="mt-8 p-4 bg-blue-50 rounded-lg text-sm text-blue-800 border border-blue-100">
      <p class="font-bold mb-2 flex items-center">
        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
        Comptes de test :
      </p>
      <ul class="space-y-1 ml-6 list-disc">
        <li><strong>admin@microbank.com</strong> (mdp: admin123)</li>
        <li><strong>agent@microbank.com</strong> (mdp: agent123)</li>
        <li><strong>client@microbank.com</strong> (mdp: client123)</li>
      </ul>
    </div>

  </div>
</div>
