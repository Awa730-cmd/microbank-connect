<div class="p-6">
  <!-- En-tête de la page -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Gestion des Crédits</h2>
    
  </div>
  <!-- Formulaire d'ajout de crédit -->
   <div class="flex-1">
  <label class="block text-sm font-medium text-gray-700 mb-1">Choisir le client</label>
  <select [(ngModel)]="nouveauClient" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <option value="" disabled selected>Sélectionner un client</option>
    <!-- Assure-toi d'avoir une variable 'comptes' ou 'clients' dans ton fichier TS -->
    <option *ngFor="let client of comptes" [value]="client.id">
      {{ client.nom }}
    </option>
  </select>
</div>
  <div class="bg-white p-6 rounded-lg shadow-md mb-6 border border-gray-100">
    <!-- Formulaire d'ajout de crédit -->
<div id="formulaireCredit" class="bg-white p-6 rounded-lg shadow-md mb-6 border border-gray-100">
    <h3 class="text-md font-semibold text-gray-700 mb-4">Demander un nouveau crédit</h3>
    
    <div class="flex gap-4 items-end">
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">Montant demandé (FCFA)</label>
        <input type="number" 
               [(ngModel)]="nouveauMontant" 
               class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="Ex: 5000000">
      </div>
      
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">Taux d'intérêt (%)</label>
        <input type="number" 
               [(ngModel)]="nouveauTaux" 
               class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="Ex: 5">
      </div>
      
      <div>
        <button (click)="validerNouveauCredit()" 
                class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition font-semibold shadow-sm">
          Valider la demande
        </button>
      </div>
    </div>
  </div>

  <!-- Tableau des crédits en cours -->
  <div class="bg-white rounded-lg shadow-md overflow-hidden">
    <div class="p-4 border-b border-gray-200 bg-gray-50">
      <h3 class="text-lg font-semibold text-gray-700">Crédits en cours</h3>
    </div>

   <div class="overflow-x-auto shadow-md rounded-lg">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-white">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Client</th>
        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Référence</th>
        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Montant</th>
        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Taux</th>
        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Statut</th>
        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Actions</th>
      </tr>
    </thead>
  </table>
</div>
      <tr *ngFor="let credit of credits" class="hover:bg-gray-50">
  <!-- 1. Référence -->
  <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
    {{ credit.reference }}
  </td>

  <!-- 2. Client -->
  <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
    {{ credit.clientNom }}
  </td>

  <!-- 3. Montant -->
  <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
    {{ credit.montant }} FCFA
  </td>

  <!-- 4. Taux -->
  <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
    {{ credit.taux }}%
  </td>

  <!-- 5. Statut -->
  <td class="px-6 py-4 whitespace-nowrap text-sm">
    <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
          [ngClass]="{
            'bg-green-100 text-green-800': credit.statut === 'Actif',
            'bg-yellow-100 text-yellow-800': credit.statut === 'En attente',
            'bg-blue-100 text-blue-800': credit.statut === 'Remboursé'
          }">
      {{ credit.statut }}
    </span>
  </td>

  <!-- 6. Actions -->
  <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
  <!-- Bouton Approuver : visible SEULEMENT si le statut est "En attente" -->
  <button *ngIf="credit.statut === 'En attente'"
          (click)="approuverCredit(credit.reference)"
          class="text-blue-600 hover:text-blue-900 bg-blue-50 px-3 py-1 rounded-md transition mr-2">
    Approuver
  </button>

  <!-- Bouton Rembourser : visible SEULEMENT si le statut est "Actif" -->
  <button *ngIf="credit.statut === 'Actif'"
          (click)="rembourserCredit(credit.reference)"
          class="text-green-600 hover:text-green-900 bg-green-50 px-3 py-1 rounded-md transition">
    Rembourser
  </button>
</td>
</tr>
  </div>
</div>
