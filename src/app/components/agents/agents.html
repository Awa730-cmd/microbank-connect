<div class="p-4 sm:p-6 max-w-7xl mx-auto">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Gestion des Agents</h2>

  <div class="flex flex-col gap-6">
    <!-- Barre de recherche -->
     <div class="mb-4 flex items-center justify-between gap-4">
  <div class="w-full sm:w-72">
    <input 
      type="text" 
      [(ngModel)]="termeRecherche" 
      (input)="rechercherAgent()" 
      placeholder="Rechercher par nom, email..." 
      class="w-full p-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
  </div>
</div>
    
    <!-- Formulaire d'ajout / modification d'un agent -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 w-full">
      <h3 class="text-lg font-semibold text-gray-700 mb-4">
        {{ isEditing ? 'Modifier l\'agent' : 'Ajouter un nouvel agent' }}
      </h3>
      
      <form (submit)="ajouterOuModifierAgent()">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Nom complet</label>
            <input type="text" [(ngModel)]="nouveauNom" name="nouveauNom" placeholder="Ex: Moussa Diop" class="w-full p-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500" required>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Email professionnel</label>
            <input type="email" [(ngModel)]="nouvelEmail" name="nouvelEmail" placeholder="Ex: moussa.diop@microbank.sn" class="w-full p-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500" required>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Agence d'affectation</label>
            <input type="text" [(ngModel)]="nouvelAgence" name="nouvelleAgence" placeholder="Ex: Dakar Plateau" class="w-full p-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
          {{ isEditing ? 'Mettre à jour l\'agent' : 'Enregistrer l\'agent' }}
        </button>
      </form>
    </div>

    <!-- Tableau dynamique des agents avec scroll horizontal forcé -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 w-full overflow-hidden">
      <div class="overflow-x-auto w-full">
        <table class="w-full text-left border-collapse min-w-[750px]">
          <thead>
            <tr class="border-b border-gray-100 bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
              <th class="p-4 whitespace-nowrap">ID</th>
              <th class="p-4 whitespace-nowrap">Nom complet</th>
              <th class="p-4 whitespace-nowrap">Email</th>
              <th class="p-4 whitespace-nowrap">Agence</th>
              <th class="p-4 whitespace-nowrap">Statut</th>
              <th class="p-4 whitespace-nowrap">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 text-sm">
            <tr *ngFor="let agent of agentsFiltres">
              <td class="p-4 text-gray-500 whitespace-nowrap">#{{ agent.id }}</td>
              <td class="p-4 font-medium text-gray-800 whitespace-nowrap">{{ agent.nom }}</td>
              <td class="p-4 text-gray-600 whitespace-nowrap">{{ agent.email }}</td>
              <td class="p-4 text-gray-600 whitespace-nowrap">{{ agent.agence }}</td>
              <td class="p-4 whitespace-nowrap">
                <span [ngClass]="agent.statut === 'Actif' ? 'text-green-600 bg-green-50 px-2 py-1 rounded-full text-xs font-medium' : 'text-red-600 bg-red-50 px-2 py-1 rounded-full text-xs font-medium'">
                  {{ agent.statut }}
                </span>
              </td>
              <td class="p-4 whitespace-nowrap space-x-3">
                <button (click)="preparerModification(agent)" class="text-blue-600 hover:underline font-medium">Modifier</button>
                <button (click)="basculerStatut(agent)" class="text-orange-600 hover:underline font-medium">
                  {{ agent.statut === 'Actif' ? 'Suspendre' : 'Activer' }}
                </button>
                <button (click)="supprimerAgent(agent.id)" class="text-red-600 hover:underline font-medium">Supprimer</button>
              </td>
            </tr>
            <tr *ngIf="listeAgents.length === 0">
              <td colspan="6" class="p-6 text-center text-gray-400">Aucun agent enregistré pour le moment.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
